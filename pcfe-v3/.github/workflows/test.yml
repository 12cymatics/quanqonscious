name: PCFE Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docker/requirements.txt
        
    # `pytest tests/` used to run here. Its only file was an environment probe
    # for CUDA-Quantum that skipped itself on every CPU runner, so this step
    # reported success having executed nothing. The probe is now a script that
    # exits non-zero when the vendor stack is absent, and it is invoked
    # directly — `pytest tests/` would now collect zero tests and exit 5.
    - name: CUDA-Quantum environment probe (expected to fail without a GPU)
      continue-on-error: true
      run: |
        python tests/check_cudaq_environment.py
