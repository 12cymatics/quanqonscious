# The two JavaScript kernels in this repository -- the boundary kernel, and the
# Faraday kernel embedded in cymatic.html -- had test suites that nothing ran.
# A suite CI never executes is not a gate, it is a file.
#
# This lives in its own workflow rather than as a job in python-app.yml because
# that one used to trigger only on `branches: [main]`, so it would not fire on a
# pull request opened against any other base -- which is how work reaches the
# default branch here. python-app.yml has since been repointed at the real
# default branch, but these suites stay separate: they need node and no Python,
# and `branches: ["**"]` below gates every pull request regardless.
#
# The push trigger named `main` for the same reason python-app.yml's did, and
# this repository has no `main` -- so the push half never fired once. It now
# names the default branch, `codex/create-github-repository-for-pcfe-v3.0`.
#
# No suite here needs a network or an install. faraday/reference.json is checked
# in -- computed once by mpmath, scipy.special and scipy.optimize.brentq -- so
# CI compares against fixed numbers rather than recomputing them with the code
# under test.
#
# dns/check-dns.mjs is a separate job because it is a two-and-a-half minute run
# rather than a twenty-second one, and because it gates something different: not
# a library of special functions but a solver, checked against analytic forces,
# analytic Laplacians, exact identities and the dispersion relation. It runs in
# CI for the reason the others do -- the first version of that solver was wrong
# by 28% on the physics while reporting eight green checks, and the gate that
# now catches it has to be executed by something other than me remembering to.
name: javascript

on:
  push:
    branches: [codex/create-github-repository-for-pcfe-v3.0]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  kernels:
    name: kernel suites
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Boundary kernel
      run: node boundary/boundarykernel.test.js
    - name: Faraday kernel (sliced out of cymatic.html)
      run: node faraday/check-kernel.mjs
    - name: Single-file build is self-contained
      run: node faraday/check-standalone.mjs

  lean-citations:
    name: lean citations
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    # lean_provenance.json is checked in for the same reason
    # faraday/reference.json is: it is the record of what `lake build SutraWS`
    # actually proved, so CI can hold the page to it without a mathlib build.
    # Regenerate it with `lake env lean ProvenanceExport.lean`.
    - name: Every theorem the page cites exists in the built environment
      run: node tools/check_citations.mjs

  dns:
    name: faraday DNS
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Free-surface Navier-Stokes solver
      run: node dns/check-dns.mjs
