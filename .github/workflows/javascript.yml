# The two JavaScript kernels in this repository -- the boundary kernel, and the
# Faraday kernel embedded in cymatic.html -- had test suites that nothing ran.
# A suite CI never executes is not a gate, it is a file.
#
# This lives in its own workflow rather than as a job in python-app.yml because
# that one used to trigger only on `branches: [main]`, so it would not fire on a
# pull request opened against any other base -- which is how work reaches the
# default branch here. python-app.yml has since been repointed at the real
# default branch, but these suites stay separate: they need node and no Python,
# and `branches: ["**"]` below gates every pull request regardless.
#
# The push trigger named `main` for the same reason python-app.yml's did, and
# this repository has no `main` -- so the push half never fired once. It now
# names the default branch, `codex/create-github-repository-for-pcfe-v3.0`.
#
# No suite here needs a network or an install. faraday/reference.json is checked
# in -- computed once by mpmath, scipy.special and scipy.optimize.brentq -- so
# CI compares against fixed numbers rather than recomputing them with the code
# under test.
#
# fsi/check-coupled-affine.mjs was in the same position these two were: 61
# checks on a construction whose every residual is claimed to be exactly zero
# over the rationals, and nothing ran them. It is added here rather than left
# out because cymatic.html no longer loads the coupled benchmark at all -- the
# panel that did was removed, since an exact-over-Q construction and a renderer
# whose numbers come from Bessel zeros and tanh of a rational cannot be one
# process -- so CI is now the only thing that executes it.
#
# dns/check-disc.mjs is its own job for the same reason dns/check-dns.mjs is: it
# is a five-and-a-half minute run, and it gates a solver rather than a library.
# It is the disc: the linearised incompressible Navier-Stokes equations in the
# actual cylindrical cell, one azimuthal mode at a time, with no slip on the floor
# and the sidewall. Its expected values come from the analytic disc dispersion
# relation, Bessel's own equation, and identities the equations must satisfy --
# never from the solver. Four defects it was written against, each found by
# measurement: a surface pressure applied as an O(1/dz) predictor force, a step
# limit that ignored the azimuthal direction, a radial grading that clustered at
# the axis instead of the rim, and uniform grids that measured the damping
# inconsistently because the Stokes layers were never resolved.
#
# dns/check-cell3d-wasm.mjs runs in the disc job rather than the DNS one, because
# what it needs is the toolchain: it rebuilds dns/faraday_cell3d.cpp with the
# runner's own clang and requires the fresh module, the committed module and
# dns/faraday-cell3d.js to produce IDENTICAL fields -- not close ones -- operator
# by operator and then over a whole drive period, 894 steps at 12x24x8. Identical
# rather than close because the C++ is a transcription, and the only property
# worth asserting about a transcription is that it changed nothing; agreement to
# twelve digits would mean the two had drifted and nobody could say where. It is a
# failure and never a skip if the rebuild cannot happen, for the same reason the
# two-dimensional one is.
#
# dns/check-wasm-build.mjs runs in the disc job, before the suite it supports.
#
# faraday/check-zip.mjs runs there too, for the toolchain rather than the
# subject: it builds faraday-cell.zip, unpacks it into a temp directory and runs
# four suites from THERE, and one of those four is check-wasm-build, which needs
# clang and lld. It is nine seconds beside a job that already installs them.
# A zip is only ever wrong in what is missing from it, and everything missing
# still builds cleanly, so building one proves nothing -- it has to be unpacked
# somewhere else and run from there. Seven injected defects were each required to
# turn it red: a file dropped from the manifest, a suite the runner does not
# list, a script left out of the single-file inliner, a README naming a path that
# does not travel, a generated runner that silently omits the slow suite, a suite
# that exits zero after fewer checks, and a file nothing but the inverse manifest
# check covers.
# dns/faraday_disc.wasm is checked in, because a browser cannot compile C++ and
# the page has to carry the module; a checked-in binary is a thing that can drift
# from its source, so this rebuilds dns/faraday_disc.cpp with the runner's own
# clang and requires the fresh module, the committed module and the JavaScript
# solver to produce identical values over a full drive period. It is a failure,
# never a skip, if the rebuild cannot happen: a checkout that cannot rebuild its
# binary has no way to know the binary matches its source, and the binary is what
# the page runs.
#
# dns/check-page.mjs is the only suite here that needs a browser, and it gets
# one without an install: the ubuntu-latest image ships Google Chrome, and node
# 22 has a global WebSocket, so it drives it over the DevTools protocol with no
# dependency. It exists because every suite above runs the physics while nothing
# ran the PAGE. Wiring the Floquet panel in, a call to config() before the
# renderer's first recompute() threw on a null state, the exception left the
# top-level script, and sprinkle()/recompute()/requestAnimationFrame never ran
# -- a blank page, with every node suite green. The same run found that the page
# declared no character set, so every micron and s^-1 on it decoded as
# windows-1252. Neither is visible from node.
#
# dns/check-cell3d.mjs shares the DNS job rather than taking one of its own. That
# line once read "seven seconds does not earn a runner", and this comment has now
# been wrong about the figure twice, so it records what the time is made of instead
# of a number to go stale again. Timed on this container: 3m00s for 214 checks;
# 1m18s for the same checks once the step's repeated index arithmetic was hoisted
# out of the conjugate-gradient matvec and the reconstruction primitives, bit for
# bit unchanged; 6m33s for 241; 11m37s for 247. Almost all of the growth is the
# two sections that integrate BOTH this solver and dns/faraday-disc.js and
# compare them -- section 12 over a quarter of a mode's period on three grids
# undriven, section 15 over ten drive periods on and off the subharmonic
# resonance -- plus ninety seconds for section 13's eight finite-amplitude runs.
# Those are the only checks in the project that compare two independently
# written solvers, so they are the last thing that should be cut for time.
#
# It still shares the job: twelve minutes beside a two-and-a-half minute suite is
# one fifteen-minute runner instead of two. It goes FIRST so its signal
# arrives before the suite behind it. It was not run by any job at all until S6f,
# which is the same gap that once let a red suite sit on the default branch -- a
# suite that exists and is not run is not a gate.
#
# dns/check-dns.mjs is a separate job because it is a long run rather than a
# twenty-second one, and because it gates something different: not a library of
# special functions but a solver, checked against analytic forces, analytic
# Laplacians, exact identities and the dispersion relation. This line said "a
# two-and-a-half minute run" and that figure was never remeasured: timed on this
# container it is 506 s. The figure is recorded here rather than relied on --
# what matters is that it is minutes, not seconds, which is the reason for the
# separate job and the reason faraday/check-zip.mjs does not run it again. It runs in
# CI for the reason the others do -- the first version of that solver was wrong
# by 28% on the physics while reporting eight green checks, and the gate that
# now catches it has to be executed by something other than me remembering to.
name: javascript

on:
  push:
    branches: [codex/create-github-repository-for-pcfe-v3.0]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  kernels:
    name: kernel suites
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Boundary kernel
      run: node boundary/boundarykernel.test.js
    - name: Faraday kernel (sliced out of cymatic.html)
      run: node faraday/check-kernel.mjs
    - name: Single-file build is self-contained
      run: node faraday/check-standalone.mjs
    - name: Exact coupled benchmark (residuals zero over Q)
      run: node fsi/check-coupled-affine.mjs

  lean-citations:
    name: lean citations
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    # lean_provenance.json is checked in for the same reason
    # faraday/reference.json is: it is the record of what `lake build SutraWS`
    # actually proved, so CI can hold the page to it without a mathlib build.
    # Regenerate it with `lake env lean ProvenanceExport.lean`.
    - name: Every theorem the page cites exists in the built environment
      run: node tools/check_citations.mjs

  dns:
    name: faraday DNS
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Nonlinear three-dimensional cell solver
      run: node dns/check-cell3d.mjs
    - name: Free-surface Navier-Stokes solver
      run: node dns/check-dns.mjs

  disc:
    name: faraday disc (cylindrical Navier-Stokes)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    # clang is on the runner image; wasm-ld comes from lld, which is not always.
    # The module needs no Emscripten and no sysroot -- it has no libc surface at
    # all -- so this is the whole toolchain.
    - name: WebAssembly toolchain
      run: sudo apt-get update && sudo apt-get install -y clang lld
    - name: The committed module is the committed source
      run: node dns/check-wasm-build.mjs
    - name: The three-dimensional C++ module is the JavaScript, bit for bit
      run: node dns/check-cell3d-wasm.mjs
    - name: The distribution zip, unpacked elsewhere and run from there
      run: node faraday/check-zip.mjs
    - name: Linearised free-surface Navier-Stokes in the cell
      run: node dns/check-disc.mjs

  page:
    name: cymatic.html in a browser
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Page loads, draws, and its Floquet panel agrees with the solver
      run: node dns/check-page.mjs
      env:
        CHROME: /usr/bin/google-chrome
