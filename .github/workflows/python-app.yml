# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # The step name said 3.11 and the step installed 3.10. `python-version`
    # was given twice and the second wins silently, so for the life of this
    # file the name asserted one version and the runner used another --
    # exactly the kind of claim that reads as verified and is not. The dead
    # key is gone and the name now matches what actually runs. 3.10 is kept
    # because that is what CI has been executing; changing the version is a
    # behaviour change, not a documentation fix.
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install CUDA toolkit (runtime only)
      uses: Jimver/cuda-toolkit@v0
      with:
        cuda: "11.8.0"
    - name: Install dependencies
      env:
        CFLAGS: "-I/usr/local/cuda/include"
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        # Use precompiled CuPy wheels to avoid source builds and missing headers
        pip install cupy-cuda11x
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
