name: submit-pypi

on:
  push:
    branches: [codex/create-github-repository-for-pcfe-v3.0]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

# Only what the job does: check out the repo. The extra grants here --
# statuses: write, pull-requests: write, checks: write -- existed solely for
# the `submit-pypi-override` Commit Status and the watchdog that posted it.
# Both are gone, so the permissions go with them rather than sitting granted
# and unused.
permissions:
  contents: read

jobs:
  submit-pypi:
    name: submit-pypi
    runs-on: ubuntu-latest
    # Also run vedic_trainer tests + sidecar tests in addition to the kernel
    # gate so any future regressions surface here, not just on the user's Mac.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build + runtime tooling
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pydantic pyyaml numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      # Lean 4 is a hard requirement of this package's test suite, not an
      # optional extra. The Lean mirror is the one independent cross-check of
      # the exact-Q kernel, and its tests used to carry skipif guards that
      # turned "the compiler is absent" into a green run -- so the mirror sat
      # broken (it could not resolve a toolchain at all) without anyone
      # noticing. The guards are gone, so CI installs the compiler instead.
      #
      # The version is read from vedic_trainer/lean-toolchain, the same pin
      # Lean4Mirror writes beside its generated scripts, so CI and a developer
      # machine compile under one toolchain rather than whichever each happens
      # to default to.
      - name: Install Lean 4 (version pinned by vedic_trainer/lean-toolchain)
        run: |
          set -eu
          TOOLCHAIN="$(cat vedic_trainer/lean-toolchain)"
          echo "Installing $TOOLCHAIN"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean runs and matches the pin
        run: |
          set -eu
          lean --version
          EXPECTED="$(cut -d: -f2 < vedic_trainer/lean-toolchain | tr -d 'v')"
          lean --version | grep -q "version ${EXPECTED}" || {
            echo "lean --version does not match vedic_trainer/lean-toolchain (${EXPECTED})"
            exit 1
          }

      - name: Build sdist + wheel for vedic_trainer
        working-directory: vedic_trainer
        run: |
          rm -rf dist build *.egg-info
          python -m build --sdist --wheel .

      - name: vedic_trainer bit-exact gate
        working-directory: vedic_trainer
        env:
          PYTHONPATH: .
        run: python scripts/verify_bit_exact.py

      - name: vedic_trainer full test suite
        working-directory: vedic_trainer
        env:
          PYTHONPATH: .
        run: pytest -q

      # The README's test counts and its "N tests are collected and N pass"
      # sentence are checked against the measured suite here, not by the
      # suite. They cannot be checked by it: verify_counts.py runs pytest, so
      # a test that called it would recurse. The suite exercises its judgment
      # (reconcile) in isolation; only this step compares the judgment against
      # the real README and the real suite, which is the part that drifts.
      - name: vedic_trainer README count gate
        working-directory: vedic_trainer
        env:
          PYTHONPATH: .
        run: python scripts/verify_counts.py --check

      - name: Publish vedic_trainer to PyPI (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: vedic_trainer
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN secret not configured; skipping upload."
            exit 0
          fi
          pip install twine
          twine upload --non-interactive dist/*

  # SutraWS is the repository's only machine-checked proof artifact: 10,311
  # lines of Lean 4 whose content is the triangular identity sum(delta 1..29)
  # = 435. Until now nothing built it. The `submit-pypi` job installs Lean
  # only so vedic_trainer's mirror tests can run, and `python-app.yml` never
  # touches Lean at all -- so the library could have stopped compiling, or
  # acquired a `sorry`, and CI would have stayed green.
  #
  # A separate job rather than more steps on `submit-pypi`: jobs run in
  # parallel, so gating the proofs costs ~9 minutes of machine time and close
  # to nothing in wall clock.
  #
  # `lake build` also runs SutraWS/AxiomAudit.lean, which fails the build if
  # any theorem in the namespace depends on `sorryAx` or on `native_decide`'s
  # `Lean.ofReduceBool`. Compiling green is not the same as being proved.
  sutraws-lean:
    name: sutraws-lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The root lean-toolchain, not vedic_trainer's. They agree today
      # (v4.10.0); reading the one that governs this build keeps them free to
      # diverge without silently compiling SutraWS under the wrong compiler.
      - name: Install Lean 4 (version pinned by ./lean-toolchain)
        run: |
          set -eu
          TOOLCHAIN="$(cat lean-toolchain)"
          echo "Installing $TOOLCHAIN"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean matches the pin
        run: |
          set -eu
          lean --version
          EXPECTED="$(cut -d: -f2 < lean-toolchain | tr -d 'v')"
          lean --version | grep -q "version ${EXPECTED}" || {
            echo "lean --version does not match ./lean-toolchain (${EXPECTED})"
            exit 1
          }

      # Resolves the dependencies pinned in lake-manifest.json and downloads
      # mathlib's prebuilt oleans. Building mathlib from source instead would
      # take hours.
      - name: Fetch mathlib build cache
        run: lake exe cache get

      - name: Build SutraWS and run the axiom audit
        run: lake build

      # The `lean citations` job checks the page against the checked-in
      # lean_provenance.json. That only means anything if the file still
      # describes this build: rename or delete a cited theorem without
      # regenerating, and the gate would certify a name the kernel no longer
      # has. Regenerating here and requiring no diff is what ties the two
      # together.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Checking only the JSON is not enough: a Lean edit that leaves the
      # theorem names and axioms alone produces the same JSON while changing
      # leanCorpusSha256, so the page could still go stale. Run the generator
      # too and require both files to come back unchanged.
      - name: Provenance still matches the built environment
        run: |
          set -eu
          lake env lean ProvenanceExport.lean
          node tools/gen_provenance.mjs
          git diff --exit-code -- lean_provenance.json vedic_v18.51.1_exact_phi.html || {
            echo "Provenance is stale. Regenerate it with:"
            echo "  lake env lean ProvenanceExport.lean && node tools/gen_provenance.mjs"
            exit 1
          }
          node tools/check_citations.mjs

  # `primarysutra.py` is the class CLAUDE.md calls the repository's main
  # VedicSutras entry point, and until now nothing tested it -- because it
  # cannot be imported without cirq, cudaq and torch, which its own
  # `_enforce_heavy_dependencies()` treats as hard requirements rather than
  # optional extras. No test referenced it, so eight of its sixteen sutras
  # raised in QUANTUM and HYBRID mode indefinitely: two dispatch targets that
  # were never defined, seven cudaq rotations with their arguments reversed,
  # two calls to a `cudaq.inverseFQFT` that does not exist, a Toffoli naming
  # its target as its own control, and three more APIs that no installed
  # version provides.
  #
  # The honest way to test a file with hard dependencies is to install them,
  # not to guard the import -- `tests/test_nothing_skips.py` would reject the
  # guard anyway. cudaq brings ~2 GB of NVIDIA wheels and runs on CPU here, so
  # this is a separate job: it runs in parallel and keeps that cost off the
  # `submit-pypi` job, which needs none of it.
  primarysutra:
    name: primarysutra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the heavy dependencies primarysutra.py requires
        run: |
          set -eu
          python -m pip install --upgrade pip
          pip install pytest numpy pandas sympy matplotlib
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install cirq-core cudaq

      - name: Verify every dependency the module enforces is importable
        run: |
          set -eu
          python -c "import numpy, pandas, sympy, cirq, cudaq, torch; print('all six present')"

      - name: All 16 sutras, in all execution modes
        run: pytest tests/test_primarysutra_modes.py -q

  # CODEX_OPENAI_MATH.md, rule C1: a formal result is a statement checked
  # against a proof by Comparator, not a proof that merely compiles. This job
  # is that check for every challenge under vedic_trainer/formal/.
  #
  # Every version is a pin, and each pin is openai/math's (rule C7): Lean
  # v4.34.1 from vedic_trainer/formal/lean-toolchain, Mathlib d13f23b from
  # its lake-manifest.json, and the three tools at the commits below, built
  # against that same Lean (lean4export has to match the Lean that wrote the
  # .olean files it reads).
  #
  # Nothing builds the solution before Comparator runs: Comparator's trust
  # argument assumes the checker has not already compiled the file it is
  # judging. `lake exe cache get` fetches only Mathlib's prebuilt files.
  formal-comparator:
    name: formal-comparator
    runs-on: ubuntu-latest
    env:
      COMPARATOR_REV: d03acab154d269c06e60e4de7e4cc85deebff94b
      LEAN4EXPORT_REV: 076e8e57707e813375e8f9da8bf989799ace9680
      LANDRUN_REV: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4 (version pinned by vedic_trainer/formal/lean-toolchain)
        run: |
          set -eu
          TOOLCHAIN="$(cat vedic_trainer/formal/lean-toolchain)"
          echo "Installing $TOOLCHAIN"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build comparator, lean4export and landrun at the pinned commits
        run: |
          set -eu
          T="$RUNNER_TEMP/tools"; mkdir -p "$T"
          TOOLCHAIN="$(cat vedic_trainer/formal/lean-toolchain)"
          for spec in "leanprover/comparator:$COMPARATOR_REV" "leanprover/lean4export:$LEAN4EXPORT_REV" "Zouuup/landrun:$LANDRUN_REV"; do
            repo="${spec%%:*}"; rev="${spec##*:}"; name="$(basename "$repo")"
            git clone --quiet "https://github.com/$repo.git" "$T/$name"
            git -C "$T/$name" checkout --quiet "$rev"
          done
          for name in comparator lean4export; do
            echo "$TOOLCHAIN" > "$T/$name/lean-toolchain"
            (cd "$T/$name" && lake build)
          done
          (cd "$T/landrun" && go build -o landrun ./cmd/landrun)
          echo "$T/landrun" >> "$GITHUB_PATH"
          echo "$T/lean4export/.lake/build/bin" >> "$GITHUB_PATH"
          echo "COMPARATOR=$T/comparator/.lake/build/bin/comparator" >> "$GITHUB_ENV"

      - name: Fetch Mathlib's prebuilt files
        working-directory: vedic_trainer/formal
        run: lake exe cache get

      - name: Comparator, every challenge
        working-directory: vedic_trainer/formal
        run: |
          set -eu
          shopt -s nullglob
          configs=(ComparatorChallenges/*.json)
          if [ "${#configs[@]}" -eq 0 ]; then
            echo "no Comparator challenges found; the glob or the directory is wrong"
            exit 1
          fi
          for cfg in "${configs[@]}"; do
            echo "::group::$cfg"
            lake env "$COMPARATOR" "$cfg"
            echo "::endgroup::"
          done
