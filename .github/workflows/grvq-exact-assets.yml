name: GRVQ exact assets

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/create-github-repository-for-pcfe-v3.0"
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  exact-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: .github/workflows/grvq-exact-assets.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flake8 numpy scipy sympy matplotlib pandas cirq-core cudaq pyyaml 'pydantic>=2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip check
      - name: Record the actual tested source and environment
        run: |
          mkdir -p ci-results/grvq-exact-assets
          git rev-parse HEAD > ci-results/grvq-exact-assets/tested-commit.txt
          python --version > ci-results/grvq-exact-assets/python-version.txt
          python -m pip freeze --all > ci-results/grvq-exact-assets/dependencies.txt
      - name: Check new and extended Python modules
        run: |
          python -m flake8 grvq_canonical.py grvq_exact_assets.py tools/check_grvq_exact_asset_gates.py \
            tests/test_grvq_canonical.py tests/test_grvq_exact_assets.py \
            vedic_trainer/vedic/kernel/k2_field.py vedic_trainer/vedic/kernel/q4_complex.py \
            vedic_trainer/vedic/kernel/wht.py vedic_trainer/vedic/kernel/tests/test_exact_asset_extensions.py \
            --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run exact assets and their existing arithmetic, field, trace, and invariant regressions
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/vedic_trainer
        run: |
          python -m pytest tests/test_grvq_canonical.py tests/test_grvq_exact_assets.py \
            tests/test_vedic_book.py tests/test_vedic_field.py tests/test_vedic_trace.py tests/test_invariants.py \
            vedic_trainer/vedic/kernel/tests \
            --junitxml=ci-results/grvq-exact-assets/pytest.xml
      - name: Require deliberate defects to fail in isolated copies
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/vedic_trainer
        run: python tools/check_grvq_exact_asset_gates.py --output ci-results/grvq-exact-assets/mutations
      - name: Upload execution and defect-check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: grvq-exact-assets-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-results/grvq-exact-assets/
          retention-days: 14
