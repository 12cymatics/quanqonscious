name: Faraday browser execution
on:
  push:
    paths: ['dns/**', 'faraday/**', 'faraday-cell/**', 'faraday-cell.zip', 'boundary/**', 'fsi/**', 'cymatic.html', 'package.json', 'package-lock.json', '.github/workflows/faraday-browser.yml']
  pull_request:
    paths: ['dns/**', 'faraday/**', 'faraday-cell/**', 'faraday-cell.zip', 'boundary/**', 'fsi/**', 'cymatic.html', 'package.json', 'package-lock.json', '.github/workflows/faraday-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Browser execution in ${{ matrix.tree }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tree: ['.', 'faraday-cell']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser prerequisite
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
      - name: Execute real browser, worker and rendering assertions
        env:
          CHROME: /usr/bin/google-chrome
          SOURCE_TREE: ${{ matrix.tree }}
        run: node "${SOURCE_TREE}/dns/check-page.mjs"
