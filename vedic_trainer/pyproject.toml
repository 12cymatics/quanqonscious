[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vedic-trainer"
version = "0.1.0"
description = "29-sutra LoRA fine-tuning kernel for small open-weights LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "QuanQonscious" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "accelerate>=0.30",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fixtures = ["playwright>=1.43"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.4"]

# There is deliberately no [project.scripts]. Five console entry points used to
# live here -- vedic-train, vedic-eval, vedic-verify, vedic-export-fixtures and
# vedic-generate -- pointing at "scripts.<module>:main". They were broken on any
# installed wheel: packages.find includes "vedic*" only, so the `scripts`
# package was never shipped and every one of them died with ModuleNotFoundError.
#
# Shipping `scripts` would not have fixed them, which is why the entry points
# went instead of the include line. Those modules are written for a source
# checkout and resolve repo paths from their own location: verify_bit_exact
# reads `Path(__file__).resolve().parents[1] / "fixtures"`, and train_lora
# shells out to `REPO / "scripts" / "verify_bit_exact.py"` with `cwd=REPO`.
# Under site-packages parents[1] is site-packages, where fixtures/ and configs/
# do not exist -- so installing the package would have swapped an import error
# for a missing-data error. It would also have put a top-level package named
# `scripts` on sys.path, colliding with every other project that does the same.
#
# These are repo workflows, and the repo runs them that way: `python
# scripts/train_lora.py --config ...`, as README.md and
# docs/BIT_EXACT_PROTOCOL.md invoke them. Nothing anywhere called the
# console names. Making them work would mean packaging fixtures/ and configs/ as
# package data and rewriting the path resolution -- a real change to undertake
# deliberately, not a line to restore here.

[tool.setuptools.packages.find]
include = ["vedic*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["transformers.*", "peft.*", "datasets.*", "accelerate.*", "playwright.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
# The whole package, not an enumerated subset. Naming three directories meant
# vedic/eval, vedic/training and vedic/memory had no tests and nobody noticed
# -- a bare `pytest` reported success without collecting a single test from
# them. A new subpackage is now covered by default rather than on remembering.
testpaths = ["vedic"]

# Deliberately NOT "-q": that flag suppresses pytest's summary line, which is
# exactly how this package came to report 145 tests for a suite of 217.
# scripts/verify_counts.py exists because of that, and setting -q here would
# recreate the condition for every plain `pytest` invocation.
addopts = ""
