<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════════
   R4 वैदिक TOROIDAL HYPERCUBE v4 — SŪTRA COMPOSITION ALGEBRA
   ───────────────────────────────────────────────────────────────────────────────
   SPECIFICATION — single source of truth for the mathematics in this file.

   STATE     S = (λ₀,λ₁,λ₂,λ₃, Ψ_grvq, B_mstvq, ω_tgcr, ρ_zpe) ∈ ℚ⁸
   SŪTRA     Tₖ : ℚ⁸ → ℚ⁸ — pure, total, and exactly invertible (Tₖ⁻¹ supplied)
   ALGEBRA   six composition modes over a queue ⟨k₁ … k_N⟩:

     ISOLATED    S′ = T_{k_N}(S₀) ;  ∀k : probeₖ = Tₖ(S₀)          [no chaining]
     SERIES      S′ = (T_{k_N} ∘ ⋯ ∘ T_{k_1})(S₀)                  [output → input]
     PARALLEL    S′ = (1/N) Σₖ Tₖ(S₀)                              [fork S₀, 1 join]
     CONCURRENT  S′ = (Φ_W ∘ ⋯ ∘ Φ₁)(S₀),  Φ_w(S) = (1/|A_w|) Σ_{k∈A_w} Tₖ(S)
                 W = ⌈√N⌉ waves, A_w = LFSR-scheduled partition    [BSP wavefront]
     INVERSE     S′ = (T_{k_1}⁻¹ ∘ ⋯ ∘ T_{k_N}⁻¹)(S₀) = (T_{k_N} ∘ ⋯ ∘ T_{k_1})⁻¹(S₀)
     COMPOSITE   S′ = Σₖ wₖ Tₖ(S₀) + Γ Σ_{j<k} w_j wₖ [T_j,Tₖ](S₀)
                 wₖ = δₖ/Σδ,  [T_j,Tₖ] = T_j∘Tₖ − Tₖ∘T_j,  Γ = R⁴(S₀)/N
     CANONICAL   S′ = Ψ_upa(Ψ_mukhya(S₀))                 [codebase-mandated]
                 Ψ_mukhya = T₁₆ ∘ ⋯ ∘ T₁ (series over the 16 mukhya)
                 Ψ_upa(S) = (1/|U|) Σ_{k∈U} Tₖ(S) (parallel over the 13 upa)
                 — matches apply_main_sutras / _run_parallel_subsutras in
                   tgcr_cymatic_engine_compliant.py, which mark this MANDATORY

   CONCURRENT strictly interpolates SERIES (W = N) and PARALLEL (W = 1).
   COMPOSITE = PARALLEL's linear part + first-order BCH commutator coupling.
   INVERSE is the exact left inverse of SERIES over the same queue (gate below).

   ARITHMETIC — BigInt rationals throughout. No Math.sin, Math.cos, Math.PI,
   Math.random, Math.sqrt, no float floor/round on state, no truncation.
     · π       Machin  π = 16·arctan(1/5) − 4·arctan(1/239), rational Taylor
     · sin/cos exact octant reduction of rational multiples of π, then Taylor
     · √       exact BigInt ⌊√n⌋ seed + rational Newton–Raphson
     · random  32-bit Galois LFSR, deterministic and seeded
     · ℚ bound continued-fraction BEST approximation, applied only at commit
               boundaries, counted and displayed — never a silent truncation
   Float appears only at the canvas/pixel boundary, marked ⟨FLOAT BOUNDARY⟩.
   ═══════════════════════════════════════════════════════════════════════════════ */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }

/* ══ 1 ══ Q — EXACT RATIONAL ARITHMETIC OVER BigInt ═════════════════════════ */
const STATS = { reductions: 0, trig: 0 };
const WORKDEN = 10n ** 32n;         // ℚ working precision inside transcendental series
/* Denominator ceiling for the LIVE state, in decimal digits.
   The sūtra map is quadratic (Yāvadūnam's d², Ūrdhva's crosswise product,
   Guṇaka's λλ terms), so iterating it SQUARES the denominator each pass:
   1 → 677 → 16 921 digits, costing 6 ms then 4 700 ms then hours. That growth
   is a real property of evaluating a quadratic map exactly, not a defect.
   Protocol §12 records that v20 compresses here and thereby "loses exact
   precision", while the canonical standalone modules do not compress at all.
   This engine does not compress. It refuses instead — loudly, with the number
   that caused the refusal — so no result is ever silently approximated.
   RESET returns to S₀. */
const DEN_LIMIT = 500;

const Q = {
  gcd(a, b) { if (a < 0n) a = -a; if (b < 0n) b = -b; while (b) { const t = b; b = a % b; a = t; } return a; },
  make(n, d = 1n) {
    if (d === 0n) throw new Error('Q: zero denominator');
    if (d < 0n) { n = -n; d = -d; }
    if (n === 0n) return [0n, 1n];
    const g = this.gcd(n, d);
    return [n / g, d / g];
  },
  int(n) { return [BigInt(n), 1n]; },
  ZERO: [0n, 1n], ONE: [1n, 1n], TWO: [2n, 1n],
  add(a, b) { return this.make(a[0] * b[1] + b[0] * a[1], a[1] * b[1]); },
  sub(a, b) { return this.make(a[0] * b[1] - b[0] * a[1], a[1] * b[1]); },
  mul(a, b) { return this.make(a[0] * b[0], a[1] * b[1]); },
  div(a, b) { if (b[0] === 0n) throw new Error('Q: divide by zero'); return this.make(a[0] * b[1], a[1] * b[0]); },
  neg(a) { return [-a[0], a[1]]; },
  abs(a) { return a[0] < 0n ? [-a[0], a[1]] : a; },
  cmp(a, b) { const l = a[0] * b[1], r = b[0] * a[1]; return l < r ? -1 : l > r ? 1 : 0; },
  sign(a) { return a[0] < 0n ? -1 : a[0] > 0n ? 1 : 0; },
  isZero(a) { return a[0] === 0n; },
  eq(a, b) { return a[0] === b[0] && a[1] === b[1]; },
  /* exact BigInt floor division — true floor, not truncate-toward-zero */
  fdiv(n, d) { const q = n / d, r = n % d; return (r !== 0n && ((r < 0n) !== (d < 0n))) ? q - 1n : q; },
  floor(a) { return this.fdiv(a[0], a[1]); },
  pow(base, e) {
    if (e === 0n) return this.ONE;
    let r = this.ONE, b = base, k = e < 0n ? -e : e;
    while (k > 0n) { if (k & 1n) r = this.mul(r, b); b = this.mul(b, b); k >>= 1n; }
    return e < 0n ? this.div(this.ONE, r) : r;
  },
  /* Continued-fraction BEST rational approximation (Stern–Brocot mediants).
     |x − p/q| < 1/q², so a bound of q ≤ 10^40 carries error < 1e-80 — 54 orders
     below the state commit bound and 64 below double precision.
     Every call is counted, split by bucket, so the cost is visible not hidden. */
  limitDen(r, maxD, bucket = 'reductions') {
    let [n, d] = r;
    if (d <= maxD) return r;
    STATS[bucket]++;
    const neg = n < 0n; if (neg) n = -n;
    let p0 = 0n, q0 = 1n, p1 = 1n, q1 = 0n, N = n, D = d;
    while (D !== 0n) {
      const a = N / D;
      const q2 = q0 + a * q1;
      if (q2 > maxD) break;
      const p2 = p0 + a * p1;
      p0 = p1; q0 = q1; p1 = p2; q1 = q2;
      const rem = N - a * D; N = D; D = rem;
    }
    const k = (maxD - q0) / q1;             // q1 ≥ 1: the first iteration always commits

    const cA = [p0 + k * p1, q0 + k * q1], cB = [p1, q1];
    let eA = n * cA[1] - cA[0] * d; if (eA < 0n) eA = -eA;
    let eB = n * cB[1] - cB[0] * d; if (eB < 0n) eB = -eB;
    const best = (eA * cB[1] <= eB * cA[1]) ? cA : cB;
    return this.make(neg ? -best[0] : best[0], best[1]);
  },
  /* ⟨FLOAT BOUNDARY⟩ display / canvas only.
     Split into integer part + fractional part so the fraction is resolved to the
     full 53-bit mantissa instead of being clipped at a fixed decimal scale. */
  f(a) {
    if (a[1] === 1n) return Number(a[0]);
    const q = this.fdiv(a[0], a[1]);
    const r = a[0] - q * a[1];                       // 0 ≤ r < d, since d > 0
    return Number(q) + Number(r * 1000000000000000000n / a[1]) / 1e18;
  },
  str(a, maxLen = 22) {
    const s = a[1] === 1n ? a[0].toString() : `${a[0]}/${a[1]}`;
    return s.length <= maxLen ? s : this.f(a).toPrecision(8);
  }
};

/* ══ 2 ══ CANONICAL SŪTRA COEFFICIENTS — Vedic protocol §4.3 ══════════════
   Each sūtra carries one exact rational. These are NOT adjustable parameters
   and NOT float literals converted after the fact: every one is written
   directly as a BigInt ratio, so no IEEE-754 representation of them ever
   exists in the arithmetic path (protocol §10.1.4).

   Note φ is the Fibonacci convergent F₅₀/F₄₉, not a Newton-refined √5. That
   is what makes the whole sūtra algebra closed in ℚ: with no irrational
   constant anywhere, every operator below inverts exactly, and the previous
   rational-approximation square root is gone rather than merely bounded
   (protocol §10.2.5 — never approximate where exact computation is possible). */
const SK = [
  Q.make(12586269025n, 7778742049n), // S1  φ      F₅₀/F₄₉
  Q.make(    2718282n,    1000000n), // S2  e
  Q.make(        355n,        113n), // S3  π      Milü
  Q.make(        577n,        408n), // S4  √2     Pell convergent
  Q.make(    5772157n,   10000000n), // S5  γ_EM   Euler–Mascheroni
  Q.make(    2302585n,    1000000n), // S6  ln 10
  Q.make(         97n,         56n), // S7  √3
  Q.make(    2236068n,    1000000n), // S8  √5
  Q.make(    2665144n,    1000000n), // S9  δ_s    silver ratio
  Q.make(    1202057n,    1000000n), // S10 ζ(3)   Apéry
  Q.make(    9159656n,   10000000n), // S11 Catalan
  Q.make(   14513692n,   10000000n), // S12 Backhouse
  Q.make(    6623490n,   10000000n), // S13 Laplace limit
  Q.make(   13247180n,   10000000n), // S14 plastic number
  Q.make(   25029079n,   10000000n), // S15 Feigenbaum α
  Q.make(   46692016n,   10000000n), // S16 Feigenbaum δ
  Q.make(    3729671n,   10000000n), // S17 K_CF
  Q.make(    4530103n,   10000000n), // S18 K_xx
  Q.make(    5671433n,   10000000n), // S19 Ω      omega constant
  Q.make(    6243300n,   10000000n), // S20 Li₂(½)
  Q.make(    6931472n,   10000000n), // S21 ln 2
  Q.make(    7651977n,   10000000n), // S22 ζ(2)/2
  Q.make(    8241323n,   10000000n), // S23 K_π/2
  Q.make(    8765482n,   10000000n), // S24 Dottie number
  Q.make(    9159656n,   10000000n), // S25 Catalan₂
  Q.make(    9560319n,   10000000n), // S26 dilogarithm
  Q.make(    9829780n,   10000000n), // S27 K_∏
  Q.make(    9961578n,   10000000n), // S28 ≈ 1 − 1/256
  Q.make(    9990234n,   10000000n)  // S29 ≈ 1 − 1/1024
];
/* §4.1 — the seven categories classify operators by STRUCTURE.
   Every sūtra below is built from ℚ-invertible primitives only:
   scale (λ ← cλ), shear (λᵢ ← λᵢ + c·λⱼ, j≠i), complement (λ ← B − λ),
   permutation, and 2×2 mixes with non-vanishing determinant. */
const CAT = { S:'MULTIPLICATIVE', R:'REFLECTIVE', C:'CONVOLUTIVE', D:'DIVISIVE',
              F:'DIFFUSIVE', P:'PERMUTATIVE', M:'MODULAR' };

/* ══ 3 ══ π (MACHIN) AND EXACT TRIG ON RATIONAL MULTIPLES OF π ════════════ */
const Tr = {
  PI: null, sc: new Map(), cc: new Map(), tc: new Map(),
  arctanRecip(x, terms) {                    // arctan(1/x) = Σ (−1)^k / ((2k+1)·x^(2k+1))
    const B = 10n ** 60n;                    // series working precision (π is built once)
    let sum = Q.ZERO;
    const xr = Q.make(1n, x), x2 = Q.mul(xr, xr);
    let p = xr;
    for (let k = 0; k < terms; k++) {
      const t = Q.div(p, Q.int(2 * k + 1));
      sum = Q.limitDen((k & 1) ? Q.sub(sum, t) : Q.add(sum, t), B, 'trig');
      p = Q.limitDen(Q.mul(p, x2), B, 'trig');
    }
    return sum;
  },
  initPi() {                                 // π = 16·arctan(1/5) − 4·arctan(1/239)
    const a = Q.mul(Q.int(16), this.arctanRecip(5n, 34));
    const b = Q.mul(Q.int(4), this.arctanRecip(239n, 14));
    this.PI = Q.limitDen(Q.sub(a, b), 10n ** 44n);      // ≈ 44 correct digits
  },
  /* sinπ(t) = sin(t·π) and cosπ(t) = cos(t·π) for rational t.
     Argument reduction is EXACT rational reduction of t (mod 2, then octant
     symmetries). π enters only in the final Taylor evaluation on |x| ≤ π/4,
     where 16 terms give error < 1e-30. */
  reduce(t) {
    const k = Q.floor(Q.div(t, Q.TWO));
    let u = Q.sub(t, Q.mul(Q.int(k), Q.TWO));                       // u ∈ [0,2)
    let sS = 1, cS = 1, swap = false;
    if (Q.cmp(u, Q.ONE) > 0) { u = Q.sub(u, Q.ONE); sS = -sS; cS = -cS; }     // [0,1]
    const HALF = Q.make(1n, 2n), QTR = Q.make(1n, 4n);
    if (Q.cmp(u, HALF) > 0) { u = Q.sub(Q.ONE, u); cS = -cS; }               // [0,1/2]
    if (Q.cmp(u, QTR) > 0) { u = Q.sub(HALF, u); swap = true; }              // [0,1/4]
    return { u, sS, cS, swap };
  },
  /* Taylor on |x| ≤ π/4. The working precision is pinned to WORKDEN on every
     iteration: without it the intermediate denominators reach ~1400 digits by
     term 15 and a single evaluation costs ~44ms. Pinned, the operands stay
     ≈266 bits and the series is ~0.1ms while still carrying < 1e-80 of error. */
  taylor(x, isSin) {
    x = Q.limitDen(x, WORKDEN, 'trig');
    let sum = isSin ? x : Q.ONE;
    const x2 = Q.limitDen(Q.mul(x, x), WORKDEN, 'trig');
    let p = sum, f = 1n, m = isSin ? 1n : 0n;
    for (let k = 1; k < 14; k++) {          // |x| ≤ π/4 ⇒ term 14 < 1e-28
      p = Q.limitDen(Q.mul(p, x2), WORKDEN, 'trig');
      f *= (m + 1n) * (m + 2n); m += 2n;
      const t = Q.div(p, [f, 1n]);
      if (t[0] === 0n) break;
      sum = Q.limitDen((k & 1) ? Q.sub(sum, t) : Q.add(sum, t), WORKDEN, 'trig');
    }
    return sum;
  },
  /* Cache the Taylor evaluation on the REDUCED octant angle u ∈ [0,1/4] rather
     than on the caller's raw t. Every t in a symmetry orbit (t, 1−t, 1+t, 2−t, …)
     collapses to the same u, so one series evaluation serves 4–8 distinct angles,
     and a sweep of k/D angles needs only D/4 evaluations. */
  taylorAt(u, isSin) {
    const key = `${u[0]}/${u[1]}|${isSin ? 's' : 'c'}`;
    const h = this.tc.get(key); if (h !== undefined) return h;
    const v = this.taylor(Q.mul(u, this.PI), isSin);
    if (this.tc.size > 4096) this.tc.clear();
    this.tc.set(key, v); return v;
  },
  sinPi(t) {
    const key = `${t[0]}/${t[1]}`; const h = this.sc.get(key); if (h !== undefined) return h;
    const r = this.reduce(t);
    let v = this.taylorAt(r.u, !r.swap);
    if ((r.swap ? r.cS : r.sS) < 0) v = Q.neg(v);
    if (this.sc.size > 8192) this.sc.clear();
    this.sc.set(key, v); return v;
  },
  cosPi(t) {
    const key = `${t[0]}/${t[1]}`; const h = this.cc.get(key); if (h !== undefined) return h;
    const r = this.reduce(t);
    let v = this.taylorAt(r.u, r.swap);
    if ((r.swap ? r.sS : r.cS) < 0) v = Q.neg(v);
    if (this.cc.size > 8192) this.cc.clear();
    this.cc.set(key, v); return v;
  }
};

/* ══ 4 ══ DETERMINISTIC LFSR (32-bit Galois) — replaces Math.random ════════ */
const Rand = {
  s: 0xACE1C0DEn, MASK: 0xFFFFFFFFn, POLY: 0xB4BCD35Cn,
  seed(v) { this.s = (BigInt(v) & this.MASK) || 1n; },
  next() { const lsb = this.s & 1n; this.s >>= 1n; if (lsb) this.s ^= this.POLY; this.s &= this.MASK; return this.s; },
  below(n) { return Number(this.next() % BigInt(n)); },
  permute(a0) {                              // Fisher–Yates — CONCURRENT wave scheduler
    const a = a0.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = this.below(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
};

/* ══ 5 ══ EXACT CONSTANTS ═════════════════════════════════════════════════ */
const K = {
  PI_F: 0,

/* ══ 6 ══ STATE ALGEBRA — S ∈ ℚ⁸, immutable ══════════════════════════════ */
const FIELDS = ['grvq', 'mstvq', 'tgcr', 'zpe'];
const St = {
  /* S₀ — the identity configuration the engine starts and resets to. */
  init() { return { l: [Q.ONE, Q.ONE, Q.ONE, Q.ONE], grvq: Q.ZERO, mstvq: Q.ZERO, tgcr: Q.ZERO, zpe: Q.ZERO }; },
  /* the additive zero of ℚ⁸ — distinct from init(); required by any Σ accumulator */
  zero() { return { l: [Q.ZERO, Q.ZERO, Q.ZERO, Q.ZERO], grvq: Q.ZERO, mstvq: Q.ZERO, tgcr: Q.ZERO, zpe: Q.ZERO }; },
  clone(s) { return { l: s.l.slice(), grvq: s.grvq, mstvq: s.mstvq, tgcr: s.tgcr, zpe: s.zpe }; },
  map2(a, b, op) {
    const r = { l: [op(a.l[0], b.l[0]), op(a.l[1], b.l[1]), op(a.l[2], b.l[2]), op(a.l[3], b.l[3])] };
    for (const f of FIELDS) r[f] = op(a[f], b[f]);
    return r;
  },
  add(a, b) { return this.map2(a, b, (x, y) => Q.add(x, y)); },
  sub(a, b) { return this.map2(a, b, (x, y) => Q.sub(x, y)); },
  scale(a, k) {
    const r = { l: a.l.map(v => Q.mul(v, k)) };
    for (const f of FIELDS) r[f] = Q.mul(a[f], k);
    return r;
  },
  mean(list) {
    if (list.length === 0) throw new Error('St.mean: empty branch set');
    let acc = list[0];
    for (let i = 1; i < list.length; i++) acc = this.add(acc, list[i]);
    return this.scale(acc, Q.make(1n, BigInt(list.length)));
  },
  /* Largest denominator carried by the state, in decimal digits. With no
     compression anywhere in the state path this is the honest cost metric:
     it shows exactly how much exactness is costing, instead of hiding it. */
  maxDenDigits(s) {
    let m = 1n;
    for (const v of s.l) if (v[1] > m) m = v[1];
    for (const f of FIELDS) if (s[f][1] > m) m = s[f][1];
    return m.toString().length;
  },
  /* Precondition, not a fallback: nothing is degraded and no default is
     returned — the operation is declined and the cause is named. */
  guard(s) {
    const d = this.maxDenDigits(s);
    if (d > DEN_LIMIT) throw new Error(
      `ℚ denominator is ${d} digits (ceiling ${DEN_LIMIT}). The state is exact and ` +
      `intact; it is simply too large to evolve further in an interactive loop. ` +
      `No compression was applied — press RESET to return to S₀.`);
    return s;
  },
  dist(a, b) {                               // ‖a − b‖₁ in ℚ — the verification residual
    let acc = Q.ZERO;
    for (let i = 0; i < 4; i++) acc = Q.add(acc, Q.abs(Q.sub(a.l[i], b.l[i])));
    for (const f of FIELDS) acc = Q.add(acc, Q.abs(Q.sub(a[f], b[f])));
    return acc;
  },
  R4(s) {                                    // R⁴(S) = Π λₖ⁴/(1 + λₖ⁴)
    let p = Q.ONE;
    for (let i = 0; i < 4; i++) {
      const l4 = Q.pow(s.l[i], 4n);          // λ⁴ ≥ 0 ⇒ 1 + λ⁴ ≥ 1, never zero
      p = Q.mul(p, Q.div(l4, Q.add(Q.ONE, l4)));
    }
    return p;
  }
};

/* δₖ = k. Σδ(1..29) = 29·30/2 = 435 — the triangular conservation identity of
   protocol §15, asserted in the invariant suite. δ drives the COMPOSITE weights
   wₖ = δₖ/Σδ and the queue's Σδ readout. */
SUTRAS.forEach(s => { s.delta = s.id; });

/* ══ 8 ══ COMPOSITION ALGEBRA — the six modes ════════════════════════════ */
const MODES = [
 { n:'ISOLATED',   f:'S′ = T<sub>k</sub>(S₀)',
   x:'∀k : probe<sub>k</sub> = T<sub>k</sub>(S₀), evaluated against S₀',
   note:'no chaining — Tⱼ never observes Tᵢ’s output; the last probe is committed' },
 { n:'SERIES',     f:'S′ = (T<sub>N</sub> ∘ ⋯ ∘ T<sub>1</sub>)(S₀)',
   x:'S<sub>i</sub> = T<sub>i</sub>(S<sub>i−1</sub>)',
   note:'output → input; order-dependent because the sūtras do not commute' },
 { n:'PARALLEL',   f:'S′ = (1/N) Σ<sub>k</sub> T<sub>k</sub>(S₀)',
   x:'fork on S₀ → private copies → one mean-join barrier',
   note:'every branch reads the SAME input; no branch sees another’s result' },
 { n:'CONCURRENT', f:'S′ = (Φ<sub>W</sub> ∘ ⋯ ∘ Φ<sub>1</sub>)(S₀)',
   x:'Φ<sub>w</sub>(S) = (1/|A<sub>w</sub>|) Σ<sub>k∈A<sub>w</sub></sub> T<sub>k</sub>(S),   W = ⌈√N⌉',
   note:'BSP wavefront, LFSR-scheduled A_w. W = N → SERIES, W = 1 → PARALLEL' },
 { n:'INVERSE',    f:'S′ = (T<sub>1</sub><sup>−1</sup> ∘ ⋯ ∘ T<sub>N</sub><sup>−1</sup>)(S₀)',
   x:'= (T<sub>N</sub> ∘ ⋯ ∘ T<sub>1</sub>)<sup>−1</sup>(S₀)',
   note:'reverse order — exactly undoes the SERIES run of the same queue' },
 { n:'COMPOSITE',  f:'S′ = Σ<sub>k</sub> w<sub>k</sub>T<sub>k</sub>(S₀) + Γ Σ<sub>j&lt;k</sub> w<sub>j</sub>w<sub>k</sub>[T<sub>j</sub>,T<sub>k</sub>](S₀)',
   x:'w<sub>k</sub> = δ<sub>k</sub>/Σδ,  [T<sub>j</sub>,T<sub>k</sub>] = T<sub>j</sub>T<sub>k</sub> − T<sub>k</sub>T<sub>j</sub>,  Γ = R⁴(S₀)/N',
   note:'linear part + first-order BCH commutator coupling — the combined function' },
 { n:'CANONICAL',  f:'S′ = Ψ<sub>upa</sub>(Ψ<sub>mukhya</sub>(S₀))',
   x:'Ψ<sub>mukhya</sub> = T<sub>16</sub> ∘ ⋯ ∘ T<sub>1</sub> (series),   Ψ<sub>upa</sub>(S) = (1/|U|) Σ<sub>k∈U</sub> T<sub>k</sub>(S) (parallel)',
   note:'the pipeline the codebase mandates: 16 mukhya in SERIES, then 13 upa in PARALLEL' }
];

const Compose = {
  /* ISOLATED — independent probes of S₀; nothing chains */
  isolated(S0, ks) {
    let out = S0;
    for (const k of ks) {
      const p = SUTRAS[k].T(S0);
      trace(`<span class="tr-s">S${k + 1} ⊥ probe ‖ΔS‖ = ${Q.str(St.dist(p, S0), 12)}</span>`);
      out = p;
    }
    return out;
  },
  /* SERIES — strict left fold, output feeds input */
  series(S0, ks) {
    let s = S0;
    for (const k of ks) {
      s = SUTRAS[k].T(s);
      trace(`<span class="tr-s">S${k + 1} ∘ → λ₀ = ${Q.str(s.l[0], 14)}</span>`);
    }
    return s;
  },
  /* PARALLEL — fork on S₀, private evaluation, single mean-join barrier */
  parallel(S0, ks) {
    const branches = ks.map(k => SUTRAS[k].T(S0));       // every branch reads S₀
    trace(`<span class="tr-ex">∥ fork ${ks.length} branches on S₀ → mean-join</span>`);
    return St.mean(branches);
  },
  /* CONCURRENT — BSP wavefront: parallel inside a wave, series across waves */
  concurrent(S0, ks) {
    const N = ks.length;
    const Wv = Math.max(1, Math.ceil(Math.sqrt(N)));      // ⟨wave count — an integer, not state⟩
    /* Seed the scheduler from the queue itself rather than from the shared LFSR
       stream. A real scheduler's interleaving is arbitrary but must be *fixed*
       for a given input, or the same queue would evolve differently on each run
       and break the determinism invariant (CODEX 7.2 / CLAUDE.md invariant 2). */
    let h = 0x9E3779B9n;
    for (const k of ks) h = (h * 33n + BigInt(k + 1)) & 0xFFFFFFFFn;
    Rand.seed(h);
    const order = Rand.permute(ks);
    const waves = Array.from({ length: Wv }, () => []);
    order.forEach((k, i) => waves[i % Wv].push(k));
    let s = S0;
    waves.forEach((A, w) => {
      if (A.length === 0) return;
      s = St.mean(A.map(k => SUTRAS[k].T(s)));            // all of A read the same s
      trace(`<span class="tr-f">Φ${w + 1} ⇉ {${A.map(k => 'S' + (k + 1)).join(',')}}</span>`);
    });
    return s;
  },
  /* INVERSE — reverse-order inverse composition; exact left inverse of series() */
  inverse(S0, ks) {
    let s = S0;
    for (let i = ks.length - 1; i >= 0; i--) {
      const k = ks[i];
      s = SUTRAS[k].I(s);
      trace(`<span class="tr-s">S${k + 1}⁻¹ ← λ₀ = ${Q.str(s.l[0], 14)}</span>`);
    }
    return s;
  },
  /* COMPOSITE — weighted linear part + commutator coupling, O(N²) pairs */
  composite(S0, ks) {
    const N = ks.length;
    const tot = ks.reduce((a, k) => a + SUTRAS[k].delta, 0);
    const w = ks.map(k => Q.make(BigInt(SUTRAS[k].delta), BigInt(tot)));
    let L = St.scale(SUTRAS[ks[0]].T(S0), w[0]);
    for (let i = 1; i < N; i++) L = St.add(L, St.scale(SUTRAS[ks[i]].T(S0), w[i]));
    const Gamma = Q.div(St.R4(S0), Q.int(N));
    const img = ks.map(k => SUTRAS[k].T(S0));              // cache Tₖ(S₀) for the pairs
    let C = St.zero(), pairs = 0;                          // Σ accumulator — additive zero, not S₀
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const comm = St.sub(SUTRAS[ks[i]].T(img[j]), SUTRAS[ks[j]].T(img[i]));   // [Tᵢ,Tⱼ](S₀)
      C = St.add(C, St.scale(comm, Q.mul(w[i], w[j])));
      pairs++;
    }
    trace(`<span class="tr-ex">Γ = ${Q.str(Gamma, 12)} · pairs = ${pairs} · ‖C‖ = ${Q.str(St.dist(C, St.zero()), 12)}</span>`);
    return St.add(L, St.scale(C, Gamma));
  },
  /* CANONICAL — the pipeline tgcr_cymatic_engine_compliant.py marks MANDATORY:
     the 16 mukhya sūtras strictly in SERIES, then the 13 upasūtras in PARALLEL
     over that result. The queue is partitioned by index rather than ignored, so
     a primary-only queue degrades to SERIES and a sub-only queue to PARALLEL. */
  canonical(S0, ks) {
    const mukhya = ks.filter(k => k < 16), upa = ks.filter(k => k >= 16);
    trace(`<span class="tr-ex">⛓ mukhya×${mukhya.length} SERIES → upa×${upa.length} PARALLEL</span>`);
    const mid = mukhya.length ? this.series(S0, mukhya) : S0;
    return upa.length ? this.parallel(mid, upa) : mid;
  }
};

/* ══ 9 ══ VERIFICATION GATE — T⁻¹ ∘ T = id ══════════════════════════════ */
function verifyInverses() {
  let exact = 0, near = 0, fail = 0;
  const probe = { l: [R(3, 2), R(5, 3), R(7, 4), R(2, 5)],
                  grvq: R(1, 3), mstvq: R(2, 7), tgcr: R(1, 5), zpe: R(3, 8) };
  const EPS = Q.make(1n, 10n ** 18n);
  for (const S of SUTRAS) {
    const d = St.dist(S.I(S.T(probe)), probe);
    if (Q.isZero(d)) exact++;
    else if (Q.cmp(d, EPS) < 0) { near++; trace(`<span class="tr-f">S${S.id} T⁻¹T ≈ id · ‖r‖ = ${Q.str(d, 13)}</span>`); }
    else { fail++; trace(`<span class="tr-e">S${S.id} T⁻¹T ✗ · ‖r‖ = ${Q.str(d, 13)}</span>`); }
  }
  let rt = '<span style="color:#888">(queue empty)</span>';
  if (QUEUE.items.length) {
    const back = Compose.inverse(Compose.series(probe, QUEUE.items), QUEUE.items);
    const d = St.dist(back, probe);
    rt = Q.isZero(d) ? '<span class="ok">EXACT</span>'
       : Q.cmp(d, EPS) < 0 ? `<span class="ok">≈ ${Q.str(d, 10)}</span>`
       : `<span class="bad">✗ ${Q.str(d, 10)}</span>`;
  }
  trace(`<span class="tr-m">⊨ T⁻¹T : ${exact} exact · ${near} ≈ (√ branch) · ${fail} fail</span>`);
  trace(`<span class="tr-m">⊨ INVERSE ∘ SERIES over queue = ${rt}</span>`);
  return { exact, near, fail };
}

/* ══ 10 ══ QUEUE / RUNTIME ══════════════════════════════════════════════ */
let STATE = null;
const QUEUE = {
  items: [], mode: 0, running: false,
  add(i) {
    if (this.items.length >= 29) return;
    this.items.push(i); this.ui();
    trace(`<span class="tr-q">+ S${i + 1} ${SUTRAS[i].la}</span>`);
  },
  clear() { this.items = []; this.ui(); trace('<span class="tr-q">queue cleared</span>'); },
  ui() {
    const d = document.getElementById('queue-display');
    d.innerHTML = this.items.length === 0
      ? '<em style="color:#555">Empty — tap sūtra cubes</em>'
      : this.items.map((i, n) => `<div class="q-item">${n + 1}. S${i + 1} δ=${SUTRAS[i].delta} ${SUTRAS[i].la.slice(0, 15)}</div>`).join('');
    const sd = this.items.reduce((s, i) => s + SUTRAS[i].delta, 0);
    document.getElementById('delta-sum').innerHTML =
      `Σδ = ${this.mode === 4 ? '−' : ''}${sd}` +
      (this.items.length === 29 ? ' <span class="ok">(29th triangular ✓)</span>' : '');
  },
  async run() {
    if (this.running || this.items.length === 0) return;
    this.running = true;
    document.getElementById('run-btn').disabled = true;
    const M = MODES[this.mode];
    trace(`<span class="tr-m">▶ ${M.n} · N = ${this.items.length}</span>`);
    await new Promise(r => setTimeout(r, 0));            // let the UI paint before the work
    const t0 = performance.now();
    /* try/finally with NO catch: every error still propagates loudly (§2.2);
       finally only guarantees the button cannot be left wedged. */
    try {
      const dIn = St.maxDenDigits(STATE);
      if (dIn > DEN_LIMIT) {
        trace(`<span class="tr-e">✗ refused: ℚ denominator ${dIn} digits > ceiling ${DEN_LIMIT}</span>`);
        trace('<span class="tr-e">  state is exact and intact — press RESET</span>');
      }
      St.guard(STATE);
      const fn = [Compose.isolated, Compose.series, Compose.parallel,
                  Compose.concurrent, Compose.inverse, Compose.composite,
                  Compose.canonical][this.mode];
      STATE = fn.call(Compose, STATE, this.items);
      const sd = this.items.reduce((s, i) => s + SUTRAS[i].delta, 0);
      showDelta(this.mode === 4 ? -sd : sd);
      for (const i of this.items) injectCymatic(i, SUTRAS[i].delta);
      trace(`<span class="tr-ex">✓ ${M.n} in ${(performance.now() - t0).toFixed(1)}ms · den ${St.maxDenDigits(STATE)}d · R⁴ = ${Q.str(St.R4(STATE), 12)}</span>`);
    } finally {
      this.running = false;
      document.getElementById('run-btn').disabled = false;
      updateFields();
    }
  },
  async cascade() {
    this.items = Array.from({ length: 29 }, (_, i) => i);
    this.mode = 6;                                        // the mandated pipeline
    document.querySelector('input[name="cmode"][value="6"]').checked = true;
    updateFormula(); this.ui();
    trace('<span class="tr-m">॥ CASCADE 29 · CANONICAL · Σδ = 435 ॥</span>');
    await this.run();
  }
};
function showDelta(d) {
  const el = document.getElementById('delta-display');
  el.textContent = d >= 0 ? `+${d}` : `${d}`;
  el.style.color = d >= 0 ? '#0f0' : '#f55';

/* ══ 11 ══ CYMATIC FIELD — exact separable tables, zero Math trig ═══════ */
const CY = {
  res: 46, modes: [], vortices: [], field: null, tbl: new Map(),
  init() { this.field = new Float32Array(this.res * this.res); this.modes = []; this.vortices = []; },
  /* Sₘ[i] = sin(m·π·i/res) from exact rational-multiple-of-π Taylor,
     converted to float ONCE at table build. ⟨FLOAT BOUNDARY⟩ */
  table(m) {
    const hit = this.tbl.get(m); if (hit) return hit;
    const t = new Float32Array(this.res);
    for (let i = 0; i < this.res; i++) t[i] = Q.f(Tr.sinPi(Q.make(BigInt(m * i), BigInt(this.res))));
    this.tbl.set(m, t); return t;
  },
  addMode(m, n, amp) {
    this.modes.push({ amp, tx: this.table(m), ty: this.table(n), w: m + n });
    while (this.modes.length > 9) this.modes.shift();
  },
  addVortex(x, y, st) { this.vortices.push({ x, y, st }); while (this.vortices.length > 7) this.vortices.shift(); },
  compute(frame) {
    const res = this.res, f = this.field;
    /* Temporal factor cos(π · ω·frame/480). The numerator is folded mod 960 —
       cos(πt) has period 2 in t, so with denominator 480 this is an EXACT
       identity, and it keeps the angle cache to 960 keys instead of growing
       without bound and missing on every frame forever. */
    const ct = this.modes.map(md => Q.f(Tr.cosPi(Q.make(BigInt((md.w * frame) % 960), 480n))));
    f.fill(0);
    for (let mi = 0; mi < this.modes.length; mi++) {
      const md = this.modes[mi], a = md.amp * ct[mi];
      if (a === 0) continue;
      for (let i = 0; i < res; i++) {
        const ai = a * md.tx[i];
        if (ai === 0) continue;
        const row = i * res;
        for (let j = 0; j < res; j++) f[row + j] += ai * md.ty[j];
      }
    }
    for (const v of this.vortices)
      for (let i = 0; i < res; i++) {
        const dy = i / res - v.y, row = i * res;
        for (let j = 0; j < res; j++) { const dx = j / res - v.x; f[row + j] += v.st / ((dx * dx + dy * dy + .012) * 260); }
      }
  },
  render(x, y, size) {
    const res = this.res, cell = size / res;
    ctx.strokeStyle = '#0ff3'; ctx.lineWidth = 1; ctx.strokeRect(x - 1, y - 1, size + 2, size + 2);
    for (let i = 0; i < res; i++) for (let j = 0; j < res; j++) {
      const v = this.field[i * res + j], k = Math.min(255, ((v < 0 ? -v : v) * 210) | 0);
      ctx.fillStyle = v < 0 ? `rgb(${(k * .32) | 0},0,${k})` : `rgb(0,${(k * .82) | 0},${k})`;
      ctx.fillRect(x + j * cell, y + i * cell, cell + .6, cell + .6);
    }
  }
};
function injectCymatic(i, d) {
  CY.addMode((i % 5) + 1, (i % 7) + 1, d / 110);
  CY.addVortex(.28 + (i % 10) * .045, .26 + ((i / 10) | 0) * .17, d / 22);
  document.getElementById('f-cymodes').textContent = CY.modes.length;
}

/* ══ 12 ══ TESSERACT — exact rotation applied to a fixed base (no drift) ═ */
const TS = {
  base: [], edges: [], proj: [],
  init() {
    for (let i = 0; i < 16; i++) this.base.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1, (i & 8) ? 1 : -1]);
    for (let i = 0; i < 16; i++) for (let j = i + 1; j < 16; j++) {
      let d = 0; for (let k = 0; k < 4; k++) if (this.base[i][k] !== this.base[j][k]) d++;
      if (d === 1) this.edges.push([i, j]);
    }
    this.proj = Array.from({ length: 16 }, () => [0, 0, 0]);
  },
  /* θ = (frame mod P)/Q · π — an exact rational multiple of π. The rotation is
     applied to the FIXED base each frame, so nothing accumulates and the
     hypercube never deforms. Both angle caches saturate after one revolution. */
  update(frame) {
    const a1 = Q.make(BigInt(frame % 1440), 720n), a2 = Q.make(BigInt(frame % 1152), 576n);
    const c1 = Q.f(Tr.cosPi(a1)), s1 = Q.f(Tr.sinPi(a1));
    const c2 = Q.f(Tr.cosPi(a2)), s2 = Q.f(Tr.sinPi(a2));
    for (let i = 0; i < 16; i++) {
      const b = this.base[i];
      const x = b[0] * c1 - b[3] * s1;            // xw-plane
      let w = b[0] * s1 + b[3] * c1;
      const y = b[1] * c2 - w * s2;               // yw-plane
      w = b[1] * s2 + w * c2;
      const k = 3 / (3 - w);
      this.proj[i] = [x * k, y * k, b[2] * k];
    }
  },
  screen(i, cx, cy, sc) { const p = this.proj[i]; return { x: cx + p[0] * sc, y: cy + p[1] * sc, z: p[2] }; }
};

/* ══ 13 ══ TORUS — exact vertex table ═══════════════════════════════════ */
const TO = {
  R: 116, r: 39, seg: 22, rings: 16, pts: [],
  init() {
    for (let i = 0; i <= this.rings; i++) {
      const tt = Q.make(BigInt(2 * i), BigInt(this.rings));
      const cT = Q.f(Tr.cosPi(tt)), sT = Q.f(Tr.sinPi(tt));
      for (let j = 0; j <= this.seg; j++) {
        const tp = Q.make(BigInt(2 * j), BigInt(this.seg));
        const cP = Q.f(Tr.cosPi(tp)), sP = Q.f(Tr.sinPi(tp));
        this.pts.push({ x: (this.R + this.r * cT) * cP, y: (this.R + this.r * cT) * sP, z: this.r * sT, ti: i, pj: j });
      }
    }
  },
  render(cx, cy, frame, sc) {
    const b1 = Q.make(BigInt(frame % 2000), 1000n), b2 = Q.make(BigInt(frame % 3000), 1500n);
    const c = Q.f(Tr.cosPi(b1)), s = Q.f(Tr.sinPi(b1));
    const cx2 = Q.f(Tr.cosPi(b2)), sx2 = Q.f(Tr.sinPi(b2));
    const gi = (Q.f(STATE.grvq) * 7) | 0, mi = (Q.f(STATE.mstvq) * 5) | 0, res = CY.res;
    ctx.fillStyle = '#0ff4'; ctx.font = '9px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('⟨ TORUS MANIFOLD ⟩', cx, cy - this.R * sc - 16);
    const sorted = this.pts.slice().sort((p, q) => p.z - q.z);
    for (const p of sorted) {
      const x = p.x * c - p.z * s, z = p.x * s + p.z * c;
      const y2 = p.y * cx2 - z * sx2, z2 = p.y * sx2 + z * cx2;
      const k = 520 / (520 + z2), X = cx + x * k * sc, Y = cy + y2 * k * sc;
      const fi = ((((p.ti * 3 + gi) % res) + res) % res) * res + ((((p.pj * 2 + mi) % res) + res) % res);
      const fv = CY.field[fi];
      const bi = Math.min(175, Math.max(0, ((fv + 1) * 62) | 0));
      const a = .18 + (z2 + this.R) / (2 * this.R) * .58;
      ctx.fillStyle = `rgba(0,${Math.min(255, bi + 80)},${Math.min(255, bi + 120)},${a})`;
      ctx.beginPath(); ctx.arc(X, Y, Math.max(1, 2 * k), 0, K.PI_F * 2); ctx.fill();
    }
  }
};

/* ══ 14 ══ SŪTRA CUBES ═════════════════════════════════════════════════ */
const cubes = [];
class Cube {
  constructor(i) {
    this.i = i; this.s = SUTRAS[i]; this.on = false; this.e = 0; this.hov = false;
    this.x = (i % 6) * 88 + 56; this.y = ((i / 6) | 0) * 82 + 214;
    this.prim = i < 16;
  }
  draw(frame) {
    const bob = Q.f(Tr.sinPi(Q.make(BigInt((frame * 2 + this.i * 37) % 720), 360n))) * 2.2;
    const sz = 30 + this.e * 9, cy = this.y + bob, o = sz * .26;
    ctx.save(); ctx.translate(this.x, cy);
    if (this.on || this.hov) { ctx.shadowColor = this.on ? '#0f0' : '#0f08'; ctx.shadowBlur = this.on ? 18 : 9; }
    ctx.fillStyle = this.on ? '#041' : '#012'; ctx.strokeStyle = '#0ff6'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.rect(-sz / 2 + o, -sz / 2 - o, sz, sz); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f5015'; ctx.strokeStyle = '#f5040';
    ctx.beginPath(); ctx.moveTo(-sz / 2, -sz / 2); ctx.lineTo(-sz / 2 + o, -sz / 2 - o);
    ctx.lineTo(-sz / 2 + o, sz / 2 - o); ctx.lineTo(-sz / 2, sz / 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff1'; ctx.strokeStyle = '#fff3';
    ctx.beginPath(); ctx.moveTo(-sz / 2, -sz / 2); ctx.lineTo(-sz / 2 + o, -sz / 2 - o);
    ctx.lineTo(sz / 2 + o, -sz / 2 - o); ctx.lineTo(sz / 2, -sz / 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    const g = ctx.createLinearGradient(0, -sz / 2, 0, sz / 2);
    g.addColorStop(0, this.on ? '#072' : (this.prim ? '#023' : '#032'));
    g.addColorStop(1, this.on ? '#041' : '#012');
    ctx.fillStyle = g;
    ctx.strokeStyle = this.on ? '#0f0' : (this.hov ? '#0f0' : (this.prim ? '#0a0' : '#aa0'));
    ctx.lineWidth = this.on ? 2 : 1;
    ctx.beginPath(); ctx.rect(-sz / 2, -sz / 2, sz, sz); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = this.on ? '#fff' : (this.prim ? '#0f0' : '#dd0');
    ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`S${this.i + 1}`, 0, -4);
    ctx.fillStyle = '#fa0'; ctx.font = '8px Courier New'; ctx.fillText(`δ${this.s.delta}`, 0, 9);
    ctx.restore();
    this.e *= .9;
  }
  hit(mx, my) { return mx > this.x - 34 && mx < this.x + 34 && my > this.y - 34 && my < this.y + 34; }
  tap() { this.on = true; this.e = 1; QUEUE.add(this.i); setTimeout(() => { this.on = false; }, 280); }
}

/* ══ 15 ══ UI ══════════════════════════════════════════════════════════ */
function trace(msg) {
  const el = document.getElementById('trace'), d = document.createElement('div');
  d.className = 'tr'; d.innerHTML = msg; el.appendChild(d); el.scrollTop = el.scrollHeight;
  while (el.children.length > 46) el.removeChild(el.firstChild);
}
function updateFields() {
  for (let i = 0; i < 4; i++) document.getElementById('f-l' + i).textContent = Q.str(STATE.l[i], 20);
  for (const f of FIELDS) document.getElementById('f-' + f).textContent = Q.str(STATE[f], 20);
  document.getElementById('f-r4').textContent = Q.str(St.R4(STATE), 18);
  document.getElementById('f-red').textContent = St.maxDenDigits(STATE);
  document.getElementById('f-redt').textContent = STATS.trig;
}
/* §2.4 — the sanskrit name, gloss, category and canonical coefficient are not
   decorative payload: they are rendered here, so every field of the SUTRAS
   table is wired to the engine. */
let lastDetail = -1;
function updateDetail(i) {
  if (i === lastDetail) return;
  lastDetail = i;
  const el = document.getElementById('sutra-detail');
  if (i < 0) {
    el.innerHTML = '<span class="dm">hover a cube for its sūtra · click to enqueue</span>';
    return;
  }
  const s = SUTRAS[i];
  el.innerHTML =
    `<span class="dv">S${s.id}</span> <span class="dsk">${s.sk}</span><br>` +
    `<span class="dv">${s.la}</span> <span class="dc">· ${s.cat} · δ=${s.delta}</span><br>` +
    `<span class="dm">${s.mn}</span><br>` +
    `<span class="dc">c = ${Q.str(SK[i], 26)} = ${Q.f(SK[i]).toFixed(9)}</span>`;
}
function updateFormula() {
  const M = MODES[QUEUE.mode];
  document.getElementById('formula').innerHTML =
    `<span class="fl">${M.n}</span><span class="fx">${M.f}</span><br><span class="fx">${M.x}</span>` +
    `<span class="fn">${M.note}</span>`;
}
function updateHUD(fps) {
  document.getElementById('hud').innerHTML =
    `<div style="color:#0f0;font-weight:bold;margin-bottom:3px">॥ R4 वैदिक HYPERCUBE v4 ॥</div>` +
    `<div style="color:#0a0">${fps.toFixed(0)} FPS · ℚ-EXACT · ${MODES[QUEUE.mode].n}</div>` +
    `<div style="margin-top:5px;border-top:1px solid #0f03;padding-top:3px">` +
    `<span style="color:#0aa">λ₀ =</span> <span style="color:#ff0">${Q.str(STATE.l[0], 24)}</span></div>` +
    `<div><span style="color:#0aa">R⁴ =</span> <span style="color:#0ff">${Q.str(St.R4(STATE), 18)}</span></div>` +
    `<div><span style="color:#0aa">π &nbsp;=</span> <span style="color:#8f8">${K.PI_F.toFixed(12)}…</span></div>` +
    `<div><span style="color:#0aa">φ &nbsp;=</span> <span style="color:#8f8">${Q.f(SK[0]).toFixed(12)} = F₅₀/F₄₉</span></div>`;
}

/* ══ 16 ══ RENDER LOOP ═════════════════════════════════════════════════ */
let last = 0, frame = 0, fps = 60, mx = 0, my = 0;
function render(ts) {
  {
    const dt = (ts - last) / 1000; last = ts; frame++;
    if (frame % 30 === 0 && dt > 0) { fps = 1 / dt; updateHUD(fps); }

    const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H));
    bg.addColorStop(0, '#0a0a18'); bg.addColorStop(1, '#000004');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#0f01'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 52) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 52) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    TS.update(frame);
    const tcx = W - 168, tcy = 196, tsc = 33;
    for (const [i, j] of TS.edges) {
      const a = TS.screen(i, tcx, tcy, tsc), b = TS.screen(j, tcx, tcy, tsc);
      ctx.strokeStyle = `rgba(0,255,110,${(.26 + ((a.z + b.z) / 2 + 2) / 4 * .5).toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.fillStyle = '#0f06'; ctx.font = '9px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('⟨ TESSERACT · 16v 32e 8c ⟩', tcx, tcy - 120);

    TO.render(W * .62, H * .52, frame, .66);

    if (frame % 5 === 0) CY.compute(frame);
    const cs = Math.min(204, H - 258);
    CY.render(352, H - cs - 18, cs);
    ctx.fillStyle = '#0ff6'; ctx.font = '9px Courier New'; ctx.textAlign = 'left';
    ctx.fillText('⟨ CYMATIC FIELD — exact Taylor tables ⟩', 352, H - cs - 26);

    let hovered = -1;
    for (const c of cubes) { c.hov = c.hit(mx, my); if (c.hov) hovered = c.i; }
    updateDetail(hovered);
    for (const c of cubes) c.draw(frame);
    if (frame % 24 === 0) updateFields();
  }
  requestAnimationFrame(render);
}

/* ══ 17 ══ EVENTS + INIT ═══════════════════════════════════════════════ */
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  for (const c of cubes) if (c.hit(x, y)) { c.tap(); break; }
});
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top;
  let over = false; for (const c of cubes) if (c.hit(mx, my)) { over = true; break; }
  canvas.style.cursor = over ? 'pointer' : 'default';
});
document.getElementById('run-btn').onclick = () => QUEUE.run();
document.getElementById('clear-btn').onclick = () => QUEUE.clear();
document.getElementById('cascade-btn').onclick = () => QUEUE.cascade();
document.getElementById('verify-btn').onclick = () => verifyInverses();
document.getElementById('reset-btn').onclick = () => {
  STATE = St.init(); CY.init(); STATS.reductions = 0; Rand.seed(0xACE1C0DEn);
  CY.addMode(2, 1, .38); CY.addMode(1, 2, .38); CY.addMode(3, 2, .2);
  updateFields(); trace('<span class="tr-m">↺ reset to S₀ = (1,1,1,1 ; 0,0,0,0)</span>');
};
document.querySelectorAll('input[name="cmode"]').forEach(inp => inp.addEventListener('change', e => {
  QUEUE.mode = parseInt(e.target.value, 10); updateFormula(); QUEUE.ui();
  trace(`<span class="tr-m">MODE → ${MODES[QUEUE.mode].n}</span>`);
}));
window.addEventListener('resize', resize);

function init() {
  resize();
  const t0 = performance.now();
  K.init();
  STATE = St.init();
  TS.init(); TO.init(); CY.init();
  CY.addMode(2, 1, .38); CY.addMode(1, 2, .38); CY.addMode(3, 2, .2);
  for (let i = 0; i < 29; i++) cubes.push(new Cube(i));
  QUEUE.ui(); updateFormula(); updateDetail(-1); updateFields(); updateHUD(60);
  trace('॥ R4 वैदिक TOROIDAL HYPERCUBE v4 ॥');
  trace(`<span class="tr-ex">ℚ exact · π Machin = ${K.PI_F.toFixed(10)}… · φ Newton</span>`);
  trace('<span class="tr-ex">trig = octant-reduced Taylor on rational·π</span>');
  trace('<span class="tr-ex">29 sūtras, each carrying an exact T⁻¹</span>');
  trace(`<span class="tr-ex">constants built in ${(performance.now() - t0).toFixed(1)}ms</span>`);
  const v = verifyInverses();
  trace(v.fail === 0
    ? '<span class="tr-ex">⊨ inverse algebra sound</span>'
    : `<span class="tr-e">⊨ ${v.fail} inverse failure(s)</span>`);
  trace('Tap cubes → queue · choose a mode · RUN');
  requestAnimationFrame(render);
}
init();
</script>
